<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Beat Roulette</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
  :root {
    color-scheme: dark;
    --bg: #121212;
    --surface: #181818;
    --elevated: #282828;
    --accent: #1DB954;
    --accent-hover: #1ed760;
    --text: #FFFFFF;
    --text-secondary: #B3B3B3;
    --text-tertiary: #535353;
  }
  html, body, #root { background: var(--bg); min-height: 100%; }
  body {
    font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior-y: none;
    color: var(--text);
  }
  .shell {
    max-width: 400px;
    margin-inline: auto;
    min-height: 100dvh;
    position: relative;
    overflow: hidden;
  }
  .fade-enter { animation: fadeIn 320ms ease forwards; }
  @keyframes fadeIn { 0%{opacity:0;transform:translateY(6px)} 100%{opacity:1;transform:translateY(0)} }

  @keyframes spin { to { transform: rotate(360deg) } }
  .spin-slow { animation: spin 6s linear infinite; }
  .spin-paused { animation-play-state: paused; }

  @keyframes eq { 0%,100% { transform: scaleY(0.35) } 50% { transform: scaleY(1) } }
  .eq-bar { transform-origin: bottom; animation: eq 900ms ease-in-out infinite; }

  @keyframes confetti {
    0% { transform: translateY(-10px) rotate(0deg); opacity: 0; }
    20% { opacity: 1; }
    100% { transform: translateY(120vh) rotate(720deg); opacity: 0; }
  }
  .confetti { position: absolute; width: 8px; height: 12px; top: -20px; animation: confetti linear infinite; }

  @keyframes splashIn {
    0%   { opacity: 0; transform: scale(0.6) }
    35%  { opacity: 1; transform: scale(1.0) }
    65%  { opacity: 1; transform: scale(1.0) }
    100% { opacity: 0; transform: scale(1.1) }
  }
  .splash-num { animation: splashIn 1500ms cubic-bezier(.22,1.4,.36,1) forwards; }
  @keyframes splashSlide {
    0% { transform: translateX(-100%); opacity: 0 }
    20% { opacity: 1 }
    80% { opacity: 1 }
    100% { transform: translateX(100%); opacity: 0 }
  }
  .splash-strip { animation: splashSlide 1500ms cubic-bezier(.22,1,.36,1) forwards; }

  /* Subtle scale pulse — no colored glow */
  @keyframes pulse-subtle {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.015); }
  }
  .pulse-glow { animation: pulse-subtle 2.4s ease-in-out infinite; }

  @keyframes kenburns {
    0%   { transform: scale(1.05) translate(0,0); }
    100% { transform: scale(1.18) translate(-2%, 1.5%); }
  }
  .kenburns { animation: kenburns 22s ease-in-out infinite alternate; }

  .pick-selected {
    background: var(--elevated);
    border-color: var(--accent);
    box-shadow: 0 0 0 1px var(--accent), 0 4px 16px -6px rgba(0, 0, 0, 0.6);
  }

  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-thumb { background: #2a2a2a; border-radius: 999px; }

  .grain::after {
    content: "";
    position: absolute; inset: 0;
    pointer-events: none;
    background-image: radial-gradient(rgba(255,255,255,0.018) 1px, transparent 1px);
    background-size: 3px 3px;
    mix-blend-mode: overlay;
    opacity: 0.4;
  }

  .tabular { font-variant-numeric: tabular-nums; }

  /* Pool counter number — clean white, flat */
  .pool-number {
    display: inline-block;
    font-size: 64px;
    line-height: 1;
    font-weight: 900;
    letter-spacing: -0.02em;
    color: #FFFFFF;
    font-variant-numeric: tabular-nums;
    padding: 0 0.06em;
  }
</style>
</head>
<body class="text-white">
<div id="root"></div>

<script type="text/babel" data-presets="react" src="network.jsx"></script>
<script type="text/babel" data-presets="react" src="app.jsx"></script>
</body>
</html>
