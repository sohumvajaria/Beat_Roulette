<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Beat Roulette</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  :root { color-scheme: dark; --bg: #0d0712; --plum: #7e3a8e; --plum-deep: #3a1947; --gold: #d4a843; --gold-bright: #f0c060; }
  html, body, #root { background: var(--bg); min-height: 100%; }
  body {
    font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior-y: none;
  }
  .shell {
    max-width: 400px;
    margin-inline: auto;
    min-height: 100dvh;
    position: relative;
    overflow: hidden;
  }
  .fade-enter { animation: fadeIn 320ms ease forwards; }
  @keyframes fadeIn { 0%{opacity:0;transform:translateY(6px)} 100%{opacity:1;transform:translateY(0)} }

  @keyframes spin { to { transform: rotate(360deg) } }
  .spin-slow { animation: spin 6s linear infinite; }
  .spin-paused { animation-play-state: paused; }

  @keyframes eq { 0%,100% { transform: scaleY(0.35) } 50% { transform: scaleY(1) } }
  .eq-bar { transform-origin: bottom; animation: eq 900ms ease-in-out infinite; }

  @keyframes drift {
    0%   { transform: translate(0,0) rotate(var(--rot)); opacity: 0; }
    10%  { opacity: var(--op); }
    90%  { opacity: var(--op); }
    100% { transform: translate(var(--dx), var(--dy)) rotate(var(--rot)); opacity: 0; }
  }
  .drifter {
    position: absolute;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: rgba(168, 85, 247, 0.18);
    white-space: nowrap;
    animation: drift var(--dur) linear infinite;
    animation-delay: var(--delay);
    pointer-events: none;
    user-select: none;
  }

  @keyframes confetti {
    0% { transform: translateY(-10px) rotate(0deg); opacity: 0; }
    20% { opacity: 1; }
    100% { transform: translateY(120vh) rotate(720deg); opacity: 0; }
  }
  .confetti { position: absolute; width: 8px; height: 12px; top: -20px; animation: confetti linear infinite; }

  /* Splash: ROUND X / Y stinger */
  @keyframes splashIn {
    0%   { opacity: 0; transform: scale(0.6) }
    35%  { opacity: 1; transform: scale(1.0) }
    65%  { opacity: 1; transform: scale(1.0) }
    100% { opacity: 0; transform: scale(1.1) }
  }
  .splash-num { animation: splashIn 1500ms cubic-bezier(.22,1.4,.36,1) forwards; }
  @keyframes splashSlide {
    0% { transform: translateX(-100%); opacity: 0 }
    20% { opacity: 1 }
    80% { opacity: 1 }
    100% { transform: translateX(100%); opacity: 0 }
  }
  .splash-strip { animation: splashSlide 1500ms cubic-bezier(.22,1,.36,1) forwards; }

  /* Pulse for live timer ring */
  @keyframes pulse-glow {
    0%, 100% { filter: drop-shadow(0 0 8px rgba(126,58,142,0.55)); }
    50% { filter: drop-shadow(0 0 18px rgba(212,168,67,0.75)); }
  }
  .pulse-glow { animation: pulse-glow 1.6s ease-in-out infinite; }

  /* KenBurns ultra-slow drift for backdrop photo */
  @keyframes kenburns {
    0%   { transform: scale(1.05) translate(0,0); }
    100% { transform: scale(1.18) translate(-2%, 1.5%); }
  }
  .kenburns { animation: kenburns 22s ease-in-out infinite alternate; }

  .pick-selected {
    background: linear-gradient(180deg, rgba(126,58,142,0.40), rgba(126,58,142,0.12));
    border-color: var(--gold);
    box-shadow: 0 0 0 1px var(--gold), 0 6px 24px -8px rgba(212, 168, 67, 0.5);
  }

  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-thumb { background: #2a2a36; border-radius: 999px; }

  .grain::after {
    content: "";
    position: absolute; inset: 0;
    pointer-events: none;
    background-image: radial-gradient(rgba(255,255,255,0.025) 1px, transparent 1px);
    background-size: 3px 3px;
    mix-blend-mode: overlay;
    opacity: 0.5;
  }

  .tabular { font-variant-numeric: tabular-nums; }
</style>
</head>
<body class="text-white">
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useMemo } = React;

// ---------- Famous artists for the lobby backdrop ----------
const FAMOUS_ARTISTS = [
  "Drake","Lil Wayne","Taylor Swift","Beyoncé","Kendrick Lamar",
  "Rihanna","The Weeknd","Bad Bunny","Billie Eilish","Dua Lipa",
  "Frank Ocean","Adele","Bruno Mars","Post Malone","Travis Scott",
  "Ariana Grande","Olivia Rodrigo","SZA","Doja Cat","Future",
  "Tyler, The Creator","J. Cole","Megan Thee Stallion","Nicki Minaj",
  "Lana Del Rey","Sabrina Carpenter","Harry Styles","Lil Baby","21 Savage"
];

// ---------- Helpers ----------
const cx = (...xs) => xs.filter(Boolean).join(" ");
const shuffle = (arr) => {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
};
const initials = (name) => {
  const parts = name.trim().split(/\s+/);
  return (parts[0]?.[0] || "?").toUpperCase() + (parts[1]?.[0] || "").toUpperCase();
};
const AVATAR_HUES = [280, 320, 250, 200, 160, 30, 350, 220, 120, 60];
const colorFor = (name) => {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) | 0;
  const hue = AVATAR_HUES[Math.abs(h) % AVATAR_HUES.length];
  return `hsl(${hue} 80% 60%)`;
};
const randomCode = () => {
  const letters = "ABCDEFGHJKMNPQRSTUVWXYZ";
  let s = "";
  for (let i = 0; i < 4; i++) s += letters[Math.floor(Math.random() * letters.length)];
  return s;
};

// ---------- Deezer (JSONP, no key required) ----------
function deezerSearch(query) {
  return new Promise((resolve, reject) => {
    const cb = "__deezer_cb_" + Math.random().toString(36).slice(2);
    const script = document.createElement("script");
    let done = false;
    const cleanup = () => {
      done = true;
      try { delete window[cb]; } catch(e) { window[cb] = undefined; }
      script.remove();
    };
    window[cb] = (data) => { if (done) return; cleanup(); resolve(data); };
    script.onerror = () => { if (done) return; cleanup(); reject(new Error("network")); };
    setTimeout(() => { if (done) return; cleanup(); reject(new Error("timeout")); }, 8000);
    script.src = `https://api.deezer.com/search?q=${encodeURIComponent(query)}&output=jsonp&callback=${cb}`;
    document.head.appendChild(script);
  });
}
function deezerArtistSearch(name) {
  return new Promise((resolve, reject) => {
    const cb = "__dz_art_" + Math.random().toString(36).slice(2);
    const script = document.createElement("script");
    let done = false;
    const cleanup = () => { done = true; try { delete window[cb]; } catch(e){ window[cb] = undefined; } script.remove(); };
    window[cb] = (data) => { if (done) return; cleanup(); resolve(data); };
    script.onerror = () => { if (done) return; cleanup(); reject(); };
    setTimeout(() => { if (done) return; cleanup(); reject(); }, 8000);
    script.src = `https://api.deezer.com/search/artist?q=${encodeURIComponent(name)}&output=jsonp&callback=${cb}&limit=1`;
    document.head.appendChild(script);
  });
}
async function fetchRandomArtistPhoto() {
  const shuffled = shuffle(FAMOUS_ARTISTS);
  for (const name of shuffled) {
    try {
      const res = await deezerArtistSearch(name);
      const a = res && res.data && res.data[0];
      const url = a && (a.picture_xl || a.picture_big || a.picture_medium);
      if (url) return { name, url };
    } catch (e) {}
  }
  return null;
}

async function findPreview(title, artist) {
  // Try a few query shapes; Deezer responds best with track + artist named.
  const queries = [
    `track:"${title}" artist:"${artist}"`,
    `${artist} ${title}`,
    `${title} ${artist}`,
  ];
  for (const q of queries) {
    try {
      const res = await deezerSearch(q);
      const tracks = (res && res.data) || [];
      const hit = tracks.find(t => t && t.preview);
      if (hit) {
        return {
          preview: hit.preview,
          deezerTitle: hit.title,
          deezerArtist: hit.artist && hit.artist.name,
          cover: hit.album && (hit.album.cover_medium || hit.album.cover),
        };
      }
    } catch (e) { /* try next query */ }
  }
  return null;
}

// ---------- Avatar ----------
function Avatar({ name, size = 36, dim = false }) {
  return (
    <div
      className="rounded-full grid place-items-center font-bold text-white shrink-0"
      style={{
        width: size, height: size,
        background: `linear-gradient(135deg, ${colorFor(name)}, hsl(280 80% 30%))`,
        fontSize: size * 0.4,
        opacity: dim ? 0.4 : 1,
        boxShadow: `0 6px 18px -8px ${colorFor(name)}`,
      }}
    >
      {initials(name)}
    </div>
  );
}

// ---------- TopBar ----------
function TopBar({ subtitle, right }) {
  return (
    <div className="px-6 pt-6 pb-3 flex items-start justify-between relative z-10">
      <div>
        <div className="flex items-center gap-2">
          <div className="w-7 h-7 rounded-full bg-gradient-to-br from-purple-500 to-purple-800 grid place-items-center shadow-[0_0_24px_-4px_rgba(126,58,142,0.7)] border border-amber-400/40">
            <div className="w-2 h-2 rounded-full bg-amber-400"></div>
          </div>
          <div className="text-[15px] font-semibold tracking-tight">Beat Roulette</div>
        </div>
        {subtitle && (
          <div className="mt-1 text-[11px] uppercase tracking-[0.18em] text-white/40">{subtitle}</div>
        )}
      </div>
      {right}
    </div>
  );
}

// ---------- Lobby backdrop: random famous-artist photo ----------
function ArtistPhotoBackdrop() {
  const [photo, setPhoto] = useState(null);
  useEffect(() => {
    let cancelled = false;
    fetchRandomArtistPhoto().then(p => { if (!cancelled && p) setPhoto(p); });
    return () => { cancelled = true; };
  }, []);
  return (
    <div className="absolute inset-0 overflow-hidden pointer-events-none">
      {photo && (
        <>
          <img
            src={photo.url}
            alt=""
            className="absolute inset-0 w-full h-full object-cover kenburns"
            style={{ opacity: 0.78 }}
          />
          {/* Plum + gold tint */}
          <div className="absolute inset-0" style={{
            background: "linear-gradient(180deg, rgba(58,25,71,0.25) 0%, rgba(58,25,71,0.45) 25%, rgba(13,7,18,0.85) 60%, rgba(13,7,18,0.98) 80%, var(--bg) 100%)"
          }} />
          <div className="absolute inset-0" style={{
            background: "radial-gradient(120% 60% at 50% 0%, rgba(212,168,67,0.10), transparent 60%)"
          }} />
          <div className="absolute bottom-2 left-0 right-0 text-center text-[9px] font-mono uppercase tracking-[0.3em] text-white/25">
            ft. {photo.name}
          </div>
        </>
      )}
      {/* Fallback plum glow when photo not yet loaded */}
      {!photo && (
        <div className="absolute inset-0" style={{
          background: "radial-gradient(60% 40% at 50% 10%, rgba(126,58,142,0.45), transparent 70%), radial-gradient(40% 30% at 80% 30%, rgba(212,168,67,0.18), transparent 70%)"
        }} />
      )}
    </div>
  );
}

// ---------- Lobby ----------
function LobbyScreen({ roomCode, players, addEntry, removeEntry, startGame }) {
  const [name, setName] = useState("");
  const [title, setTitle] = useState("");
  const [artist, setArtist] = useState("");
  const [err, setErr] = useState("");
  const [loading, setLoading] = useState(false);

  const submit = async () => {
    setErr("");
    if (!name.trim()) return setErr("Add your name.");
    if (!title.trim() || !artist.trim()) return setErr("Add song title and artist.");
    setLoading(true);
    let found = null;
    try {
      found = await findPreview(title.trim(), artist.trim());
    } catch (e) { /* swallow, fall through to no-preview */ }
    setLoading(false);
    addEntry({
      id: Math.random().toString(36).slice(2),
      player: name.trim(),
      title: title.trim(),
      artist: artist.trim(),
      url: found ? found.preview : null,
      cover: found ? found.cover : null,
      noPreview: !found,
    });
    setName(""); setTitle(""); setArtist("");
  };

  const uniquePlayers = useMemo(() => {
    const seen = new Set();
    const out = [];
    for (const p of players) {
      if (!seen.has(p.player)) { seen.add(p.player); out.push(p.player); }
    }
    return out;
  }, [players]);

  const canStart = players.length >= 3 && uniquePlayers.length >= 2;

  return (
    <div className="fade-enter relative">
      <ArtistPhotoBackdrop />
      <div className="relative">
        <TopBar
          subtitle="Lobby"
          right={
            <div className="text-right">
              <div className="text-[10px] uppercase tracking-[0.18em] text-white/40">Room</div>
              <div className="font-mono text-sm font-semibold tracking-[0.18em] text-amber-300">{roomCode}</div>
            </div>
          }
        />

        <div className="px-6 relative z-10">
          <h1 className="text-[28px] leading-[1.05] font-semibold tracking-tight drop-shadow-[0_2px_8px_rgba(0,0,0,0.6)]">
            Guess who<br/>brought the <span className="text-amber-400">vibe</span>.
          </h1>
          <p className="mt-2 text-sm text-white/65 drop-shadow-[0_2px_6px_rgba(0,0,0,0.6)]">
            Drop a song. We'll spin it. Friends race to guess who picked it.
          </p>
        </div>

        {uniquePlayers.length > 0 && (
          <div className="mt-5 px-6">
            <div className="text-[11px] uppercase tracking-[0.18em] text-white/40 mb-2">
              In the room · {uniquePlayers.length}
            </div>
            <div className="flex gap-2 overflow-x-auto pb-1 -mx-1 px-1">
              {uniquePlayers.map(n => (
                <div key={n} className="flex flex-col items-center gap-1 min-w-[56px]">
                  <Avatar name={n} size={40} />
                  <div className="text-[11px] text-white/70 truncate max-w-[60px]">{n}</div>
                </div>
              ))}
            </div>
          </div>
        )}

        <div className="mt-5 mx-6 rounded-2xl border border-white/10 bg-black/40 backdrop-blur-xl p-4 space-y-3 grain relative z-10">
          <Field label="Your name" value={name} onChange={setName} placeholder="e.g. Maya" />
          <div className="grid grid-cols-2 gap-2">
            <Field label="Song title" value={title} onChange={setTitle} placeholder="Levitating" />
            <Field label="Artist" value={artist} onChange={setArtist} placeholder="Dua Lipa" />
          </div>
          <div className="flex items-center gap-2 text-[11px] text-white/40">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
            <span>30-sec preview fetched automatically via Deezer.</span>
          </div>
          {err && <div className="text-[12px] text-rose-400">{err}</div>}
          <button
            disabled={loading}
            onClick={submit}
            className={cx(
              "w-full mt-1 rounded-xl py-3 text-sm font-semibold active:scale-[0.99] transition shadow-[0_10px_28px_-10px_rgba(126,58,142,0.9)] flex items-center justify-center gap-2 border",
              loading
                ? "bg-purple-700/60 text-white/70 cursor-wait border-purple-700/40"
                : "bg-gradient-to-b from-purple-600 to-purple-800 hover:brightness-110 border-amber-400/40 text-white"
            )}
          >
            {loading && (
              <svg className="animate-spin" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round">
                <path d="M21 12a9 9 0 1 1-6.219-8.56"></path>
              </svg>
            )}
            {loading ? "Finding preview…" : "Add to pool"}
          </button>
        </div>

        <div className="mt-6 px-6 relative z-10">
          <PoolCounter count={players.length} />
        </div>

        <div className="px-6 pt-6 pb-10">
          <button
            disabled={!canStart}
            onClick={startGame}
            className={cx(
              "w-full rounded-xl py-4 text-base font-semibold transition",
              canStart
                ? "bg-gradient-to-b from-purple-600 to-purple-800 hover:brightness-110 shadow-[0_14px_36px_-12px_rgba(126,58,142,0.9)] border-amber-400/40 border"
                : "bg-white/[0.04] text-white/30 border border-white/5"
            )}
          >
            {canStart
              ? `Start · ${players.length} round${players.length === 1 ? "" : "s"} →`
              : players.length < 3
                ? `Need ${3 - players.length} more song${3 - players.length === 1 ? "" : "s"}`
                : "Need at least 2 different players"
            }
          </button>
        </div>
      </div>
    </div>
  );
}

// ---------- Anonymous pool counter ----------
function PoolCounter({ count }) {
  const remaining = Math.max(0, 3 - count);
  const ready = count >= 3;
  // Stack of disc placeholders, max 8 shown
  const discs = Math.min(count, 8);
  return (
    <div className="rounded-2xl border border-white/10 bg-black/30 backdrop-blur px-5 py-5 text-center grain relative overflow-hidden">
      <div className="absolute -right-12 -top-12 w-32 h-32 rounded-full bg-purple-600/15 blur-3xl"></div>
      <div className="absolute -left-12 -bottom-12 w-32 h-32 rounded-full bg-amber-400/10 blur-3xl"></div>

      <div className="text-[10px] uppercase tracking-[0.22em] text-white/40">Songs in the pool</div>
      <div className="relative mt-1 flex items-baseline justify-center gap-2">
        <div className="text-[64px] leading-none font-black tracking-tighter tabular bg-gradient-to-br from-amber-200 via-amber-300 to-amber-500 bg-clip-text text-transparent">
          {count}
        </div>
      </div>
      {discs > 0 && (
        <div className="mt-3 flex items-center justify-center -space-x-2">
          {Array.from({ length: discs }).map((_, i) => (
            <div
              key={i}
              className="w-5 h-5 rounded-full border border-white/15"
              style={{
                background: "radial-gradient(circle at center, #d4a843 0 14%, #1b0f24 16% 55%, #0c0610 56% 100%)",
                transform: `translateY(${(i % 2) * -1}px)`,
              }}
            />
          ))}
          {count > 8 && (
            <div className="ml-3 text-[11px] font-mono text-white/40 tabular">+{count - 8}</div>
          )}
        </div>
      )}
      <div className="mt-3 text-[11px] text-white/50">
        {ready
          ? <span className="text-amber-300">Ready to roll — hit start whenever.</span>
          : `${remaining} more to start${count > 0 ? "" : " · min 3"}.`}
      </div>
    </div>
  );
}

function Field({ label, value, onChange, placeholder, mono }) {
  return (
    <label className="block">
      <div className="text-[11px] uppercase tracking-[0.16em] text-white/45 mb-1">{label}</div>
      <input
        value={value}
        onChange={(e) => onChange(e.target.value)}
        placeholder={placeholder}
        className={cx(
          "w-full rounded-lg bg-black/40 border border-white/10 px-3 py-2.5 text-sm outline-none",
          "placeholder:text-white/25 focus:border-purple-500 focus:bg-black/60 transition",
          mono && "font-mono text-[12px]"
        )}
      />
    </label>
  );
}

// ---------- Pre-round splash ----------
function SplashScreen({ roundNumber, totalRounds, onDone }) {
  useEffect(() => {
    const t = setTimeout(onDone, 1500);
    return () => clearTimeout(t);
  }, [onDone]);
  return (
    <div className="fade-enter absolute inset-0 grid place-items-center bg-[var(--bg)] z-30">
      <div className="relative w-full">
        <div className="absolute inset-x-0 top-1/2 -translate-y-1/2 h-24 splash-strip bg-gradient-to-r from-transparent via-amber-500/25 to-transparent"></div>
        <div className="relative text-center splash-num">
          <div className="text-[11px] uppercase tracking-[0.32em] text-amber-300/90">Round</div>
          <div className="mt-1 text-[96px] leading-none font-black tracking-tighter bg-gradient-to-br from-amber-200 via-white to-purple-300 bg-clip-text text-transparent">
            {roundNumber}
          </div>
          <div className="-mt-2 text-sm text-white/40 tabular">of {totalRounds}</div>
        </div>
      </div>
    </div>
  );
}

// ---------- Timer ring ----------
function TimerRing({ progress, size = 168, stroke = 6 }) {
  const r = (size - stroke) / 2;
  const c = 2 * Math.PI * r;
  return (
    <svg width={size} height={size} className="pulse-glow">
      <defs>
        <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stopColor="#7e3a8e" />
          <stop offset="100%" stopColor="#f0c060" />
        </linearGradient>
      </defs>
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="rgba(126,58,142,0.18)" strokeWidth={stroke} />
      <circle
        cx={size/2} cy={size/2} r={r}
        fill="none" stroke="url(#ring)" strokeWidth={stroke}
        strokeLinecap="round"
        strokeDasharray={c}
        strokeDashoffset={c * (1 - progress)}
        transform={`rotate(-90 ${size/2} ${size/2})`}
        style={{ transition: "stroke-dashoffset 120ms linear" }}
      />
    </svg>
  );
}

// ---------- Round ----------
function RoundScreen({ song, roundNumber, totalRounds, players, streaks, onSubmit }) {
  const audioRef = useRef(null);
  const startedAtRef = useRef(null);
  const [progress, setProgress] = useState(0);
  const [duration, setDuration] = useState(30);
  const [playing, setPlaying] = useState(false);
  const [audioError, setAudioError] = useState(false);
  const [guesses, setGuesses] = useState({});
  const [guessTimes, setGuessTimes] = useState({});
  const [activeGuesser, setActiveGuesser] = useState(null);
  const [submittedAll, setSubmittedAll] = useState(false);

  useEffect(() => {
    setProgress(0);
    setAudioError(song.noPreview || !song.url);
    setGuesses({});
    setGuessTimes({});
    setActiveGuesser(null);
    setSubmittedAll(false);
    startedAtRef.current = performance.now();
    const a = audioRef.current;
    if (!a || !song.url) return;
    a.currentTime = 0;
    const tryPlay = a.play();
    if (tryPlay && tryPlay.then) {
      tryPlay.then(() => setPlaying(true)).catch(() => setPlaying(false));
    }
  }, [song.id]);

  useEffect(() => {
    const a = audioRef.current;
    if (!a) return;
    const onTime = () => {
      if (a.duration && isFinite(a.duration)) {
        setDuration(a.duration);
        setProgress(Math.min(1, a.currentTime / a.duration));
      } else {
        setProgress(Math.min(1, a.currentTime / 30));
      }
    };
    const onErr = () => { setAudioError(true); setPlaying(false); };
    const onPlay = () => { setPlaying(true); setAudioError(false); };
    const onPause = () => setPlaying(false);
    const onEnd = () => { setPlaying(false); setProgress(1); };
    a.addEventListener("timeupdate", onTime);
    a.addEventListener("error", onErr);
    a.addEventListener("play", onPlay);
    a.addEventListener("pause", onPause);
    a.addEventListener("ended", onEnd);
    return () => {
      a.removeEventListener("timeupdate", onTime);
      a.removeEventListener("error", onErr);
      a.removeEventListener("play", onPlay);
      a.removeEventListener("pause", onPause);
      a.removeEventListener("ended", onEnd);
    };
  }, []);

  const togglePlay = () => {
    const a = audioRef.current;
    if (!a) return;
    if (a.paused) {
      const p = a.play();
      if (p && p.catch) p.catch(() => setAudioError(true));
    } else { a.pause(); }
  };

  const allPlayerNames = useMemo(() => Array.from(new Set(players.map(p => p.player))), [players]);
  const guessers = allPlayerNames;

  const setGuess = (guesser, target) => {
    if (guesser === target) return;
    setGuesses(g => ({ ...g, [guesser]: target }));
    setGuessTimes(t => ({
      ...t,
      [guesser]: t[guesser] != null ? t[guesser] : (performance.now() - (startedAtRef.current || performance.now()))
    }));
  };

  const allDone = guessers.every(g => guesses[g]);

  const submit = () => {
    if (!allDone) return;
    setSubmittedAll(true);
    onSubmit({ guesses, guessTimes });
  };

  const secondsLeft = Math.max(0, Math.ceil((1 - progress) * (duration || 30)));

  return (
    <div className="fade-enter relative">
      {/* Blurred album-cover backdrop */}
      {song.cover && (
        <div className="absolute inset-0 overflow-hidden pointer-events-none">
          <img
            src={song.cover}
            alt=""
            className="absolute inset-0 w-full h-full object-cover"
            style={{ filter: "blur(40px) saturate(1.15)", transform: "scale(1.25)", opacity: 0.55 }}
          />
          <div className="absolute inset-0" style={{
            background: "linear-gradient(180deg, rgba(13,7,18,0.55) 0%, rgba(13,7,18,0.80) 40%, rgba(13,7,18,0.95) 75%, var(--bg) 100%)"
          }} />
          <div className="absolute inset-0" style={{
            background: "radial-gradient(80% 50% at 50% 0%, rgba(212,168,67,0.08), transparent 60%)"
          }} />
        </div>
      )}
      <div className="relative z-10">
      <TopBar
        subtitle="Round in play"
        right={
          <div className="text-right">
            <div className="text-[10px] uppercase tracking-[0.18em] text-white/40">Round</div>
            <div className="font-mono text-sm font-semibold text-amber-300 tabular">
              {roundNumber}<span className="text-white/30">/{totalRounds}</span>
            </div>
          </div>
        }
      />

      <div className="mx-6 mt-1 rounded-3xl border border-white/10 bg-black/30 backdrop-blur-md p-5 grain relative overflow-hidden">
        <div className="absolute -right-10 -top-10 w-40 h-40 rounded-full bg-purple-600/20 blur-3xl"></div>
        <div className="absolute -left-10 -bottom-10 w-40 h-40 rounded-full bg-amber-400/10 blur-3xl"></div>

        <div className="flex flex-col items-center">
          <div className="relative grid place-items-center" style={{ width: 168, height: 168 }}>
            <div className="absolute inset-0"><TimerRing progress={progress} /></div>
            {/* Album-art disc center */}
            <div className={cx(
              "w-[120px] h-[120px] rounded-full overflow-hidden",
              "border border-white/10 grid place-items-center relative",
              "spin-slow", !playing && "spin-paused"
            )}>
              {song.cover ? (
                <>
                  <img src={song.cover} alt="" className="absolute inset-0 w-full h-full object-cover" />
                  <div className="absolute inset-0" style={{
                    background: "radial-gradient(circle at center, rgba(0,0,0,0.85) 0 14%, transparent 14.5% 60%, rgba(0,0,0,0.55) 60.5% 100%)"
                  }}></div>
                </>
              ) : (
                <div className="absolute inset-0" style={{
                  background: "radial-gradient(circle at center, #000 0 18%, #2a1735 18.5% 60%, #0c0610 60.5% 100%)"
                }}></div>
              )}
              <div className="relative w-6 h-6 rounded-full bg-amber-400 shadow-[0_0_18px_rgba(212,168,67,0.7)]"></div>
              <div className="absolute top-1 left-1/2 -translate-x-1/2 w-[2px] h-2 bg-white/30 rounded-full"></div>
            </div>
            <div className="absolute bottom-3 right-3 px-2 py-0.5 rounded-full bg-black/60 border border-white/10 text-[11px] font-mono tabular text-white/70">
              0:{secondsLeft.toString().padStart(2,"0")}
            </div>
          </div>

          <div className="mt-3 text-[11px] uppercase tracking-[0.18em] text-amber-300/90">Now spinning</div>
          <div className="mt-1 text-lg font-semibold leading-tight text-center px-4 truncate w-full">{song.title}</div>
          <div className="text-sm text-white/65 text-center truncate w-full px-4">{song.artist}</div>

          <div className="mt-3 flex items-center gap-3 text-[11px] text-white/45 font-mono">
            {playing ? (
              <div className="flex items-end gap-[2px] h-3">
                <div className="w-[2px] bg-amber-400 eq-bar"></div>
                <div className="w-[2px] bg-amber-400 eq-bar" style={{ animationDelay: "120ms" }}></div>
                <div className="w-[2px] bg-amber-400 eq-bar" style={{ animationDelay: "240ms" }}></div>
              </div>
            ) : <div className="w-2 h-2 rounded-full bg-white/30"></div>}
            <button
              onClick={togglePlay}
              disabled={!song.url}
              className={cx("underline-offset-2 hover:underline", !song.url && "opacity-30 cursor-not-allowed")}
            >
              {playing ? "pause" : "play"}
            </button>
          </div>
          {audioError && (
            <div className="mt-2 text-[12px] text-amber-300/90 text-center">
              Preview unavailable for this song — guess from title & artist.
            </div>
          )}
        </div>

        {song.url && <audio ref={audioRef} src={song.url} preload="auto" />}
      </div>

      <div className="mt-6 px-6">
        <div className="flex items-baseline justify-between">
          <div className="text-[11px] uppercase tracking-[0.18em] text-white/40">Who picked it?</div>
          <div className="text-[11px] text-white/40 tabular">{Object.keys(guesses).length}/{guessers.length} locked in</div>
        </div>

        <div className="mt-3 flex flex-wrap gap-2">
          {guessers.map(g => (
            <button
              key={g}
              onClick={() => setActiveGuesser(g)}
              className={cx(
                "px-2.5 py-1.5 rounded-full text-xs font-medium border transition flex items-center gap-1.5",
                activeGuesser === g
                  ? "bg-white text-black border-white"
                  : guesses[g]
                    ? "bg-purple-700/40 border-amber-400/50 text-amber-100"
                    : "bg-black/30 border-white/10 text-white/70"
              )}
            >
              <Avatar name={g} size={18} />
              <span>{g}</span>
              {streaks[g] >= 2 && <span className="text-[11px]">🔥{streaks[g]}</span>}
              {guesses[g] && <span className="text-amber-300">✓</span>}
            </button>
          ))}
        </div>

        <div className="mt-4 rounded-2xl border border-white/10 bg-black/30 backdrop-blur-md p-3 min-h-[180px]">
          {!activeGuesser ? (
            <div className="text-center text-sm text-white/40 py-10">
              Pick your name above to lock in your guess.
            </div>
          ) : (
            <>
              <div className="px-2 py-1 text-[11px] uppercase tracking-[0.16em] text-white/40">
                <span className="text-amber-300">{activeGuesser}</span>, who do you suspect?
              </div>
              <div className="mt-2 grid grid-cols-2 gap-2">
                {allPlayerNames.map(name => {
                  const self = name === activeGuesser;
                  const selected = guesses[activeGuesser] === name;
                  return (
                    <button
                      key={name}
                      disabled={self}
                      onClick={() => setGuess(activeGuesser, name)}
                      className={cx(
                        "rounded-xl px-3 py-3 text-sm font-medium border text-left transition flex items-center gap-2",
                        self
                          ? "bg-white/[0.02] border-white/5 text-white/25 cursor-not-allowed"
                          : selected
                            ? "pick-selected"
                            : "bg-black/30 border-white/10 hover:border-white/25"
                      )}
                    >
                      <Avatar name={name} size={26} dim={self} />
                      <div className="min-w-0">
                        <div className="truncate">{name}</div>
                        {self && <div className="text-[10px] text-white/30">that's you</div>}
                      </div>
                    </button>
                  );
                })}
              </div>
            </>
          )}
        </div>
      </div>

      <div className="px-6 pt-6 pb-10">
        <button
          disabled={!allDone || submittedAll}
          onClick={submit}
          className={cx(
            "w-full rounded-xl py-4 text-base font-semibold transition border",
            allDone && !submittedAll
              ? "bg-gradient-to-b from-purple-600 to-purple-800 hover:brightness-110 shadow-[0_14px_36px_-12px_rgba(126,58,142,0.9)] border-amber-400/40"
              : "bg-white/[0.04] text-white/30 border-white/5"
          )}
        >
          {allDone ? "Reveal →" : `${Object.keys(guesses).length}/${guessers.length} guesses in`}
        </button>
      </div>
      </div>
    </div>
  );
}

// ---------- Results ----------
function ResultsScreen({ song, guesses, guessTimes, scores, scoreDeltas, players, streaks, fastestCorrect, onNext, isFinal }) {
  const allNames = useMemo(() => Array.from(new Set(players.map(p => p.player))), [players]);

  const sorted = useMemo(() =>
    allNames.map(n => ({ name: n, score: scores[n] || 0, delta: scoreDeltas[n] || 0 }))
            .sort((a, b) => b.score - a.score),
    [scores, scoreDeltas, allNames]
  );

  const topScore = sorted[0]?.score ?? 0;

  const guessers = Object.keys(guesses);
  const wrongCount = guessers.filter(g => guesses[g] !== song.player).length;
  const halfWrong = guessers.length > 0 && wrongCount * 2 >= guessers.length;

  return (
    <div className="fade-enter relative">
      <TopBar subtitle="Reveal" />

      <div className="mx-6 mt-1 rounded-3xl border border-white/10 bg-gradient-to-b from-purple-600/[0.22] to-white/[0.02] p-5 grain relative overflow-hidden">
        <div className="absolute -left-10 -bottom-10 w-40 h-40 rounded-full bg-amber-400/20 blur-3xl"></div>
        <div className="text-[11px] uppercase tracking-[0.18em] text-amber-300/90">It was…</div>
        <div className="mt-2 flex items-center gap-3">
          <Avatar name={song.player} size={48} />
          <div className="min-w-0">
            <div className="text-3xl font-semibold tracking-tight leading-none truncate">{song.player}</div>
            <div className="mt-1 text-sm text-white/60 truncate">
              <span className="text-white/90">{song.title}</span> · {song.artist}
            </div>
          </div>
        </div>

        <div className="mt-4 flex flex-wrap gap-2">
          {halfWrong && (
            <span className="inline-flex items-center gap-1.5 text-[12px] px-2.5 py-1 rounded-full bg-amber-400/10 text-amber-300 border border-amber-400/20">
              ✦ Sneaky pick · owner +1
            </span>
          )}
          {fastestCorrect && (
            <span className="inline-flex items-center gap-1.5 text-[12px] px-2.5 py-1 rounded-full bg-amber-500/15 text-amber-200 border border-amber-400/40">
              ⚡ Fastest · {fastestCorrect} +1
            </span>
          )}
        </div>
      </div>

      <div className="mt-6 px-6">
        <div className="text-[11px] uppercase tracking-[0.18em] text-white/40">Guesses</div>
        <div className="mt-3 space-y-2">
          {guessers.map(guesser => {
            const target = guesses[guesser];
            const right = target === song.player;
            const t = guessTimes[guesser];
            const seconds = t != null ? (t / 1000).toFixed(1) : "—";
            const delta = scoreDeltas[guesser] || 0;
            return (
              <div key={guesser} className={cx(
                "flex items-center gap-3 rounded-xl px-3 py-2.5 border",
                right ? "border-emerald-500/30 bg-emerald-500/[0.08]" : "border-white/10 bg-white/[0.03]"
              )}>
                <Avatar name={guesser} size={28} />
                <div className="min-w-0 flex-1">
                  <div className="text-sm truncate">
                    <span className="font-medium">{guesser}</span>
                    <span className="text-white/40"> → </span>
                    <span className="font-medium">{target}</span>
                  </div>
                  <div className="text-[11px] text-white/40 font-mono tabular">
                    {right ? "correct" : "wrong"} · {seconds}s
                    {streaks[guesser] >= 2 && right && <span className="ml-1 text-amber-300">🔥 {streaks[guesser]}</span>}
                  </div>
                </div>
                <div className={cx(
                  "text-[12px] font-semibold px-2 py-1 rounded-full tabular",
                  delta > 0 ? "bg-emerald-500/15 text-emerald-300" : "bg-white/[0.06] text-white/40"
                )}>
                  {delta > 0 ? `+${delta}` : "—"}
                </div>
              </div>
            );
          })}
        </div>
      </div>

      <div className="mt-6 px-6">
        <div className="text-[11px] uppercase tracking-[0.18em] text-white/40">Leaderboard</div>
        <div className="mt-3 rounded-2xl border border-white/10 bg-white/[0.03] overflow-hidden">
          {sorted.map((row, i) => (
            <div key={row.name} className={cx(
              "flex items-center gap-3 px-4 py-3 border-b border-white/5 last:border-b-0",
              row.score === topScore && row.score > 0 && "bg-purple-600/[0.10]"
            )}>
              <div className="w-5 text-xs font-mono text-white/40 tabular">{i + 1}</div>
              <Avatar name={row.name} size={26} />
              <div className="text-sm font-medium flex-1 truncate">{row.name}</div>
              {row.delta > 0 && (
                <div className="text-[11px] font-mono tabular text-emerald-300/90">+{row.delta}</div>
              )}
              <div className="text-sm font-mono tabular w-7 text-right">{row.score}</div>
            </div>
          ))}
        </div>
      </div>

      <div className="px-6 pt-6 pb-10">
        <button
          onClick={onNext}
          className="w-full rounded-xl py-4 text-base font-semibold transition bg-gradient-to-b from-purple-600 to-purple-800 hover:brightness-110 shadow-[0_14px_36px_-12px_rgba(126,58,142,0.9)] border border-amber-400/40"
        >
          {isFinal ? "See final results →" : "Next round →"}
        </button>
      </div>
    </div>
  );
}

// ---------- Final ----------
function FinalScreen({ scores, players, onReset }) {
  const sorted = useMemo(() => {
    const allNames = Array.from(new Set(players.map(p => p.player)));
    return allNames
      .map(n => ({ name: n, score: scores[n] || 0 }))
      .sort((a, b) => b.score - a.score);
  }, [scores, players]);

  const winnerScore = sorted[0]?.score ?? 0;
  const winners = sorted.filter(s => s.score === winnerScore && winnerScore > 0);

  const confetti = useMemo(() =>
    new Array(28).fill(0).map((_, i) => ({
      left: Math.random() * 100,
      delay: Math.random() * 2,
      dur: 3 + Math.random() * 3,
      color: ["#7e3a8e","#d4a843","#fbbf24","#a855f7","#ffffff"][i % 5],
      rot: Math.random() * 360,
      key: i,
    })), []);

  const podium = sorted.slice(0, 3);
  const podiumOrder = [1, 0, 2]; // visual: 2nd, 1st, 3rd
  const heights = { 0: 132, 1: 96, 2: 72 };
  const podiumColors = [
    "from-amber-400 to-amber-600",
    "from-zinc-300 to-zinc-500",
    "from-orange-500 to-orange-700",
  ];

  return (
    <div className="fade-enter relative min-h-[100dvh]">
      <div className="absolute inset-0 overflow-hidden pointer-events-none">
        {confetti.map(c => (
          <div
            key={c.key}
            className="confetti"
            style={{
              left: c.left + "%",
              background: c.color,
              animationDuration: c.dur + "s",
              animationDelay: c.delay + "s",
              transform: `rotate(${c.rot}deg)`,
              borderRadius: "2px",
            }}
          />
        ))}
      </div>

      <TopBar subtitle="Final score" />

      <div className="mx-6 mt-2 rounded-3xl border border-amber-400/40 bg-gradient-to-b from-purple-600/[0.30] to-amber-500/[0.06] p-6 grain relative overflow-hidden">
        <div className="absolute -right-10 -top-10 w-48 h-48 rounded-full bg-amber-400/25 blur-3xl"></div>
        <div className="text-[11px] uppercase tracking-[0.18em] text-amber-200/90">
          {winners.length > 1 ? "It's a tie" : "Winner"}
        </div>
        <div className="mt-1 text-4xl font-semibold tracking-tight leading-tight">
          {winners.length === 0 ? "Nobody, somehow" : winners.map(w => w.name).join(" & ")}
        </div>
        <div className="mt-2 text-sm text-white/65 tabular">
          {winnerScore} point{winnerScore === 1 ? "" : "s"} · taste validated.
        </div>
      </div>

      {podium.length >= 2 && (
        <div className="mt-6 px-6">
          <div className="flex items-end justify-center gap-2 h-[200px]">
            {podiumOrder.map(idx => {
              const row = podium[idx];
              if (!row) return <div key={idx} className="flex-1" />;
              return (
                <div key={row.name} className="flex-1 flex flex-col items-center justify-end">
                  <div className="mb-2 flex flex-col items-center">
                    <Avatar name={row.name} size={idx === 0 ? 48 : 36} />
                    <div className="mt-1 text-xs font-medium truncate max-w-[100px] text-center">{row.name}</div>
                    <div className="text-[10px] text-white/40 font-mono tabular">{row.score} pt{row.score === 1 ? "" : "s"}</div>
                  </div>
                  <div
                    className={cx(
                      "w-full rounded-t-lg pt-2 font-black text-black/60 text-xl text-center",
                      "bg-gradient-to-b", podiumColors[idx]
                    )}
                    style={{ height: heights[idx] }}
                  >
                    {idx + 1}
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      )}

      <div className="mt-6 px-6">
        <div className="text-[11px] uppercase tracking-[0.18em] text-white/40">All standings</div>
        <div className="mt-3 space-y-2">
          {sorted.map((row, i) => {
            const isWinner = row.score === winnerScore && winnerScore > 0;
            return (
              <div key={row.name} className={cx(
                "flex items-center gap-3 rounded-xl px-3 py-2.5 border",
                isWinner ? "border-purple-500/50 bg-purple-600/[0.12]" : "border-white/10 bg-white/[0.03]"
              )}>
                <div className={cx(
                  "w-7 h-7 rounded-full grid place-items-center text-xs font-semibold tabular",
                  i === 0 ? "bg-amber-400/20 text-amber-300" :
                  i === 1 ? "bg-zinc-400/20 text-zinc-200" :
                  i === 2 ? "bg-orange-400/20 text-orange-300" :
                            "bg-white/[0.05] text-white/40"
                )}>{i + 1}</div>
                <Avatar name={row.name} size={26} />
                <div className="text-sm font-medium flex-1 truncate">{row.name}</div>
                <div className="text-sm font-mono tabular">{row.score}</div>
              </div>
            );
          })}
        </div>
      </div>

      <div className="px-6 pt-8 pb-10">
        <button
          onClick={onReset}
          className="w-full rounded-xl py-4 text-base font-semibold transition bg-white text-black hover:bg-white/90"
        >
          Play again
        </button>
      </div>
    </div>
  );
}

// ---------- App ----------
function App() {
  const [roomCode] = useState(randomCode());
  const [screen, setScreen] = useState("lobby");
  const [players, setPlayers] = useState([]);
  const [order, setOrder] = useState([]);
  const [roundIdx, setRoundIdx] = useState(0);
  const [scores, setScores] = useState({});
  const [scoreDeltas, setScoreDeltas] = useState({});
  const [streaks, setStreaks] = useState({});
  const [currentGuesses, setCurrentGuesses] = useState({});
  const [currentGuessTimes, setCurrentGuessTimes] = useState({});
  const [fastestCorrect, setFastestCorrect] = useState(null);

  const addEntry = (entry) => setPlayers(ps => [...ps, entry]);
  const removeEntry = (id) => setPlayers(ps => ps.filter(p => p.id !== id));

  const startGame = () => {
    const ids = shuffle(players.map(p => p.id));
    const allNames = Array.from(new Set(players.map(p => p.player)));
    const init = Object.fromEntries(allNames.map(n => [n, 0]));
    const initStreaks = Object.fromEntries(allNames.map(n => [n, 0]));
    setOrder(ids);
    setRoundIdx(0);
    setScores(init);
    setStreaks(initStreaks);
    setScoreDeltas({});
    setScreen("splash");
  };

  const currentSong = useMemo(() => {
    if (!order.length) return null;
    const id = order[roundIdx];
    return players.find(p => p.id === id);
  }, [order, roundIdx, players]);

  const submitGuesses = ({ guesses, guessTimes }) => {
    setCurrentGuesses(guesses);
    setCurrentGuessTimes(guessTimes);
    const song = currentSong;
    if (!song) return;

    const next = { ...scores };
    const nextStreaks = { ...streaks };
    const deltas = {};
    const guessers = Object.keys(guesses);

    let fastest = null;
    let fastestT = Infinity;
    for (const g of guessers) {
      if (guesses[g] === song.player) {
        const t = guessTimes[g] ?? Infinity;
        if (t < fastestT) { fastestT = t; fastest = g; }
      }
    }

    let wrong = 0;
    for (const g of guessers) {
      const right = guesses[g] === song.player;
      let delta = 0;
      if (right) {
        delta += 1;
        if (g === fastest) delta += 1;
        const newStreak = (nextStreaks[g] || 0) + 1;
        nextStreaks[g] = newStreak;
        if (newStreak >= 3) delta += 1;
      } else {
        nextStreaks[g] = 0;
        wrong++;
      }
      if (delta > 0) next[g] = (next[g] || 0) + delta;
      deltas[g] = delta;
    }
    if (guessers.length > 0 && wrong * 2 >= guessers.length) {
      next[song.player] = (next[song.player] || 0) + 1;
      deltas[song.player] = (deltas[song.player] || 0) + 1;
    }

    setScores(next);
    setStreaks(nextStreaks);
    setScoreDeltas(deltas);
    setFastestCorrect(fastest);
    setScreen("results");
  };

  const nextRound = () => {
    if (roundIdx + 1 >= order.length) {
      setScreen("final");
    } else {
      setRoundIdx(i => i + 1);
      setScreen("splash");
    }
  };

  const reset = () => {
    setScreen("lobby");
    setPlayers([]);
    setOrder([]);
    setRoundIdx(0);
    setScores({});
    setStreaks({});
    setScoreDeltas({});
    setCurrentGuesses({});
    setCurrentGuessTimes({});
    setFastestCorrect(null);
  };

  return (
    <div className="shell">
      {screen === "lobby" && (
        <LobbyScreen
          roomCode={roomCode}
          players={players}
          addEntry={addEntry}
          removeEntry={removeEntry}
          startGame={startGame}
        />
      )}
      {screen === "splash" && currentSong && (
        <SplashScreen
          roundNumber={roundIdx + 1}
          totalRounds={order.length}
          onDone={() => setScreen("round")}
        />
      )}
      {screen === "round" && currentSong && (
        <RoundScreen
          key={currentSong.id}
          song={currentSong}
          roundNumber={roundIdx + 1}
          totalRounds={order.length}
          players={players}
          streaks={streaks}
          onSubmit={submitGuesses}
        />
      )}
      {screen === "results" && currentSong && (
        <ResultsScreen
          song={currentSong}
          guesses={currentGuesses}
          guessTimes={currentGuessTimes}
          scores={scores}
          scoreDeltas={scoreDeltas}
          players={players}
          streaks={streaks}
          fastestCorrect={fastestCorrect}
          onNext={nextRound}
          isFinal={roundIdx + 1 >= order.length}
        />
      )}
      {screen === "final" && (
        <FinalScreen
          scores={scores}
          players={players}
          onReset={reset}
        />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
